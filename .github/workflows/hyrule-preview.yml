name: 海拉鲁移动端预览

on:
  push:
    branches: [feat/hyrule-subtitles]

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'sokouu87/MoviePilotLite'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: hyrule-android-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    if: github.repository == 'sokouu87/MoviePilotLite'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          cache: true
      - run: flutter pub get
      - run: pod install
        working-directory: ios
        env:
          TYPHOEUS_HTTP_VERSION: CURL_HTTP_VERSION_1_1
      - if: matrix.target == 'iphoneos'
        run: |
          flutter build ios --release --no-codesign --dart-define=FLUTTER_APP_ENV=release
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -q -r -y hyrule-ios-unsigned.ipa Payload
      - if: matrix.target == 'iphonesimulator'
        run: |
          flutter build ios --debug --simulator
          cd build/ios/iphonesimulator
          zip -q -r -y hyrule-ios-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: hyrule-${{ matrix.target }}
          path: |
            build/ios/${{ matrix.target }}/hyrule-ios-unsigned.ipa
            build/ios/${{ matrix.target }}/hyrule-ios-simulator.zip
          if-no-files-found: error
